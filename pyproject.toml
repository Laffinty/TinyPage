[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tinypage"
version = "2.0.0"
description = "Zero-dependency static site generator for docs and digital gardens"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Laffinty"}
]
keywords = ["static-site-generator", "documentation", "digital-garden", "python"]
classifiers = [
    "Development Status :: 5 - Production/Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]

dependencies = ["click"]

[project.optional-dependencies]
markdown = ["mistune>=3.0"]
syntax = ["pygments"]
ai = ["openai", "deepseek"]
server = ["waitress"]
test = ["pytest>=7.0"]
full = ["mistune>=3.0", "pygments", "openai", "deepseek"]

[project.scripts]
tinypage = "tinypage.__main__:main"

[project.urls]
Homepage = "https://github.com/Laffinty/TinyPage"
Repository = "https://github.com/Laffinty/TinyPage"

[tool.setuptools.packages.find]
where = ["."]
include = ["tinypage*"]

[tool.setuptools.package-dir]
"" = "."