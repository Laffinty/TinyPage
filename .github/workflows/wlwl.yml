name: wlwl

# Only run when WLWL-related content changes - docs edits must not burn CI quota
on:
  push:
    branches: [main]
    paths:
      - 'tp/**'
      - '.github/workflows/wlwl.yml'
      - '.gitattributes'
  pull_request:
    paths:
      - 'tp/**'
      - '.github/workflows/wlwl.yml'
      - '.gitattributes'
  workflow_dispatch:

# Cancel in-progress runs for the same branch
concurrency:
  group: wlwl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # NOTE: Windows runner - the Windows build of WLWL is a .exe;
    # the Linux build is a .tar.xz and names the TLS extension differently.
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # --- 1) fetch the WLWL compiler ---
      - name: Download WLWL 0.12.1 (Windows x86_64)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '0.12.1'
          $asset = "wlwl-v$ver-x86_64-pc-windows-msvc.zip"
          # sha256 published by the official release (v0.12.1)
          $sha = '7b8c9650276a3f662ef9d7ba6aa778382a7977e0269ff43dc1cc54420ff8e545'
          $url = "https://github.com/Laffinty/wlwl/releases/download/v$ver/$asset"

          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\$asset"
          $got = (Get-FileHash "$env:RUNNER_TEMP\$asset" -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $sha) {
            Write-Error "sha256 mismatch: expected $sha got $got"
            exit 1
          }
          Write-Host "sha256 OK: $got"

          Expand-Archive "$env:RUNNER_TEMP\$asset" -DestinationPath "$env:RUNNER_TEMP\wlwl" -Force
          # NOTE: stdlib ships as EXTERNAL files (lib/stdlib/*.wll), not embedded
          Add-Content $env:GITHUB_PATH "$env:RUNNER_TEMP\wlwl"

      - name: Verify WLWL version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $v = & wlwl.exe --version
          Write-Host "wlwl: $v"
          if ($v -notmatch '0\.12\.1') {
            Write-Error "unexpected wlwl version: $v"
            exit 1
          }

      # --- 2) generated artifacts must match their generators ---
      # This is the PRIMARY reason this CI exists: tp/**/*.wll are products of
      # tp/test/gen_*.py. If someone edits a generator but forgets to re-run it
      # (or hand-edits a .wll), the committed artifacts drift from the
      # generators - and such drift does NOT fail at compile time, it only
      # misbehaves at run time (placeholders not restored, wrong nesting).
      - name: Regenerate .wll artifacts and verify no drift
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # auto-discover: every tp/test/gen_*.py (incl. gen_test_*.py and
          # gen_*_baseline.py) - new modules are covered without editing CI
          $gens = @(Get-ChildItem -Path tp\test -Filter 'gen_*.py' -File | Sort-Object Name)
          if ($gens.Count -eq 0) { Write-Error 'no generators found'; exit 1 }
          foreach ($g in $gens) {
            Write-Host "regen $($g.Name)"
            python $g.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

          # both .wll products and the JSON baselines must be reproducible
          $diff = git diff --stat -- 'tp/lib/*.wll' 'tp/test/*.wll' 'tp/test/fixtures/*.json'
          if ($diff) {
            Write-Host "::error::Generated artifacts are out of sync with their generators."
            Write-Host $diff
            Write-Host "Run: python tp\test\gen_<module>.py then commit."
            exit 1
          }
          Write-Host "generated artifacts are in sync ($($gens.Count) generators)"

      # --- 3) static checks (fast, more precise than the compiler) ---
      - name: Static checks (paren / semicolon / generator args)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wll = @(Get-ChildItem -Path tp\lib,tp\test -Filter *.wll -File |
                   Where-Object { $_.FullName -notlike '*broken*' })
          python tp\test\paren_check.py @($wll | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python tp\test\check_semis.py @($wll | ForEach-Object { $_.FullName })
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $gens = @(Get-ChildItem -Path tp\test -Filter 'gen_*.py' -File | Sort-Object Name)
          foreach ($g in $gens) {
            Write-Host "check_c_args $($g.Name)"
            python tp\test\check_c_args.py $g.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # --- 4) compile ---
      - name: wlwl check
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $wll = @(Get-ChildItem -Path tp\lib,tp\test -Filter *.wll -File |
                   Where-Object { $_.FullName -notlike '*broken*' })
          foreach ($f in $wll) {
            Write-Host "check $($f.Name)"
            & wlwl.exe check $f.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # --- 5) Reverse guard: a broken file must be rejected by check ---
      # If check returns 0 for a broken file, the toolchain usage is wrong
      # => every other acceptance in this workflow is untrustworthy.
      #
      # NOTE: shell is cmd, not pwsh. broken.wll always writes diagnostics to
      # stderr; PowerShell (incl. pwsh 7) turns native stderr into an error
      # stream and throws under $ErrorActionPreference='Stop' -- even with
      # 2>&1 | Out-Null (PS 7 also has $PSNativeCommandUseErrorActionPreference,
      # default true). To read the EXIT CODE, keep PowerShell out of it.
      # NOTE: a call :label sub is used instead of && / || because chained
      # cmd conditionals can swallow the exit code.
      # NOTE: comments inside the run block MUST be ASCII -- cmd REM lines do
      # not understand UTF-8 and would try to execute the Chinese text.
      - name: Reverse guard (broken file must fail to check)
        shell: cmd
        run: |
          call :guard tp\test\broken\broken.wll
          exit /b %ERRORLEVEL%

          :guard
          wlwl.exe check %1
          if %ERRORLEVEL% EQU 0 (
            echo ::error::GUARD FAILED: %1 passed wlwl check
            exit /b 1
          )
          echo guard OK: %1 rejected with exit %ERRORLEVEL%
          exit /b 0

      # --- 6) run the tests ---
      # NOTE: RUN_TESTS() failures do NOT change the process exit code, so the
      # test files PANIC themselves; the exit code here is meaningful.
      - name: Run tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # smoke first (it is not named test_*.wll), then every test file
          & wlwl.exe run tp\test\smoke.wll
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tests = @(Get-ChildItem -Path tp\test -Filter 'test_*.wll' -File | Sort-Object Name)
          foreach ($t in $tests) {
            Write-Host "run $($t.Name)"
            & wlwl.exe run $t.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Write-Host "$($tests.Count + 1) test file(s) passed"
