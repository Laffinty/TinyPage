version: '3.8'

services:
  tinypage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tinypage
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    environment:
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASS=${ADMIN_PASS:-}
      - SITE_TITLE=${SITE_TITLE:-My TinyPage Site}
      - SITE_URL=${SITE_URL:-}
      - STATIC_HOST=0.0.0.0
      - STATIC_PORT=8080
      - ADMIN_PORT=8081
    volumes:
      - ./pages:/app/pages
      - ./themes:/app/themes
      - ./static:/app/static
      - ./config.py:/app/config.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    container_name: tinypage-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./pages:/usr/share/nginx/html:ro
    depends_on:
      - tinypage

networks:
  default:
    name: tinypage-network