/* ========== UTILITIES ========== */

    color: var(--text);
    margin-bottom: 1.25rem;
    letter-spacing: -0.02em;
  }

  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
}

/* ========== ANIMATIONS ========== */
@layer animations {
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes glowPulse {
    0%, 100% { box-shadow: 0 0 12px var(--primary-glow); }
    50% { box-shadow: 0 0 28px var(--primary-glow); }
  }

  .post-preview,
  .post,
  .related-item,
  .search-results .result-item {
    animation: fadeIn 0.55s ease-out both;
  }

  .post-preview:nth-child(1) { animation-delay: 0.05s; }
  .post-preview:nth-child(2) { animation-delay: 0.1s; }
  .post-preview:nth-child(3) { animation-delay: 0.15s; }
  .post-preview:nth-child(4) { animation-delay: 0.2s; }
  .post-preview:nth-child(5) { animation-delay: 0.25s; }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 600px) {
  .container { padding: 1.25rem 1rem; }
  .site-header {
    flex-direction: column;
    align-items: flex-start;
    padding-left: 1rem;
    padding-right: 1rem;
    margin-left: -1rem;
    margin-right: -1rem;
  }
  .post { padding: 1.5rem; }
  .editor-grid { grid-template-columns: 1fr; }
  .pagination {
    flex-direction: column;
    align-items: stretch;
    .page-numbers { justify-content: center; }
  }
}
